<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>RBA 검증 노트</title>
<meta name="theme-color" content="#F2F4F6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101013" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="RBA 노트">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;font-size:14px}
img{max-width:100%}[hidden]{display:none!important}
#lock{--l-bg:#F2F4F6;--l-card:#fff;--l-ink:#191F28;--l-sub:#6B7684;--l-line:#E5E8EB;--l-blue:#3182F6;--l-red:#F04452;
  min-height:100vh;min-height:100dvh;background:var(--l-bg);color:var(--l-ink);display:flex;flex-direction:column;justify-content:center;
  padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));padding-block:40px;box-sizing:border-box}
@media (prefers-color-scheme:dark){#lock{--l-bg:#101013;--l-card:#1D1D22;--l-ink:#F2F4F6;--l-sub:#9EA7B2;--l-line:#2C2C33;--l-blue:#3B8BFF;--l-red:#F25563}:root{color-scheme:dark}}
html:has(#lock){background:#F2F4F6}
@media (prefers-color-scheme:dark){html:has(#lock){background:#101013}}
.lk{max-width:380px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.lk img{width:64px;height:64px;border-radius:16px}
.lk h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.03em;line-height:1.3}
.lk p{margin:6px 0 0;color:var(--l-sub);font-size:16px;line-height:1.5}
.lk form{display:flex;flex-direction:column;gap:12px}
.lk input[type=password]{font:inherit;font-size:18px;padding:16px 18px;border-radius:16px;border:2px solid transparent;background:var(--l-card);color:var(--l-ink);outline:none;box-sizing:border-box;width:100%}
.lk input[type=password]:focus{border-color:var(--l-blue)}
.lk label{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--l-sub)}
.lk label input{width:20px;height:20px;accent-color:var(--l-blue)}
.lk button{font:inherit;font-size:17px;font-weight:700;border:0;border-radius:16px;padding:17px;background:var(--l-blue);color:#fff;cursor:pointer}
.lk button:disabled{opacity:.6}
.lk .err{color:var(--l-red);font-size:15px;min-height:1.4em;margin:0}
</style>
</head>
<body>
<div id="lock">
  <div class="lk">
    <img src="icons/icon-192.png" alt="">
    <div><h1>RBA 검증 노트</h1><p>비밀번호를 넣으면 열려요.</p></div>
    <form id="lf" autocomplete="off">
      <input type="password" id="pw" placeholder="비밀번호" aria-label="비밀번호" autocomplete="current-password">
      <label><input type="checkbox" id="rm" checked> 이 폰에서 기억하기</label>
      <button type="submit" id="go">열기</button>
      <p class="err" id="er" role="alert"></p>
    </form>
  </div>
</div>
<script>
(function(){
  var K = "rba-note-pw", P = null;
  var b64 = function(s){ return Uint8Array.from(atob(s), function(c){ return c.charCodeAt(0); }); };
  function get(){ return P ? Promise.resolve(P) : fetch("payload.json?v=3", {cache:"no-cache"}).then(function(r){ return r.json(); }).then(function(j){ P = j; return j; }); }
  function open(pw){
    return get().then(function(j){
      var enc = new TextEncoder();
      return crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]).then(function(base){
        return crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(j.salt), iterations:j.iter, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
      }).then(function(key){ return crypto.subtle.decrypt({name:"AES-GCM", iv:b64(j.iv)}, key, b64(j.ct)); });
    }).then(function(buf){ return JSON.parse(new TextDecoder().decode(buf)); });
  }
  function mount(app){
    document.getElementById("lock").remove();
    var st = document.createElement("style"); st.textContent = app.css; document.head.appendChild(st);
    document.body.insertAdjacentHTML("beforeend", app.html);
    app.js.forEach(function(code){ var s = document.createElement("script"); s.textContent = code; document.body.appendChild(s); });
  }
  var er = document.getElementById("er"), btn = document.getElementById("go"), pw = document.getElementById("pw");
  function tryOpen(p, remember, silent){
    btn.disabled = true; btn.textContent = "여는 중이에요";
    return open(p).then(function(app){
      try { if (remember) localStorage.setItem(K, p); else localStorage.removeItem(K); } catch(e) {}
      mount(app);
    }).catch(function(e){
      btn.disabled = false; btn.textContent = "열기";
      if (!silent) er.textContent = (e && e.name === "OperationError") ? "비밀번호가 맞지 않아요. 다시 넣어 주세요." : "불러오지 못했어요. 인터넷 연결을 확인해 주세요.";
      try { if (silent) localStorage.removeItem(K); } catch(x) {}
    });
  }
  document.getElementById("lf").addEventListener("submit", function(e){
    e.preventDefault(); er.textContent = "";
    if (!pw.value) { er.textContent = "비밀번호를 넣어 주세요."; return; }
    tryOpen(pw.value, document.getElementById("rm").checked, false);
  });
  var saved = null; try { saved = localStorage.getItem(K); } catch(e) {}
  if (saved) tryOpen(saved, true, true); else pw.focus();
  if ("serviceWorker" in navigator && location.protocol === "https:") navigator.serviceWorker.register("sw.js").catch(function(){});
})();
</script>
</body>
</html>
